# ============ Docker 镜像构建校验 ============
# 仅校验镜像能否成功构建（含前端 Vite 构建与后端 uv 依赖安装），不推送镜像。
# 项目不对外发布，因此无需登录 registry 或打 tag。
# 仅手动触发：Actions 页面 → Docker Build → Run workflow。

name: Docker Build

on:
  workflow_dispatch:

# 同分支重复手动触发时取消旧的构建，避免流程堆积
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # 利用 GitHub Actions 缓存加速层构建（前端 pnpm 安装、后端 uv sync 等重层）
          cache-from: type=gha
          cache-to: type=gha,mode=max
