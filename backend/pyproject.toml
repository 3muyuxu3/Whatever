[project]
name = "simulmirror-backend"
version = "0.1.0"
description = "SimulMirror - 模拟镜像，推演未来"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "AGPL-3.0" }
authors = [{ name = "SimulMirror" }]

# 核心依赖（应用启动所必需）
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "openai>=1.0.0",
    "pymupdf>=1.24.0",
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # 知识图谱与多智能体模拟（完整功能所需）
    "zep-cloud==3.13.0",
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
]

[project.optional-dependencies]
# 测试依赖：uv sync --extra test
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
